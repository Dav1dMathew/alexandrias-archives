plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.thinkerthonker'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Keep the application's compiled classes explicit on the test classpath.
    // This is required by the repository's Gradle 9 wrapper with Boot 3.x.
    testImplementation files(sourceSets.main.output)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        resources.srcDir '../contracts/fixtures'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
